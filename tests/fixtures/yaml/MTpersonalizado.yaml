# Escribir la definición de la máquina de Turing.
# Esta plantilla es una MT funcional de ejemplo: acepta cadenas de la forma a+b
# (una o más 'a' seguidas de una 'b'). Reemplaza los valores por los de tu máquina.

q_states:
  q_list: ["q0", "q1", "qf"]
  initial: "q0"
  final: "qf"

alphabet: [a, b]                # alfabeto de entrada (sin blanco)
tape_alphabet: [a, b, null]     # incluye el blanco (null); "#" va entre comillas

delta:
  # q0 lee 'a' -> escribe 'a', avanza a la derecha y pasa a q1
  - params:
      initial_state: "q0"
      mem_cache_value: null     # null = blanco
      tape_input: a
    output:
      final_state: "q1"
      mem_cache_value: null
      tape_output: a
      tape_displacement: R      # L, R o S
  # q1 lee 'a' -> sigue avanzando
  - params:
      initial_state: "q1"
      mem_cache_value: null
      tape_input: a
    output:
      final_state: "q1"
      mem_cache_value: null
      tape_output: a
      tape_displacement: R
  # q1 lee 'b' -> acepta (estado final)
  - params:
      initial_state: "q1"
      mem_cache_value: null
      tape_input: b
    output:
      final_state: "qf"
      mem_cache_value: null
      tape_output: b
      tape_displacement: S

simulation_strings:
  - ab
  - aab
  - aaab