# Máquina de Turing reconocedora para L = { w#w | w in {a, b}+ }
# Basada en la especificación y ejemplo del documento Proyecto No 3.pdf
q_states:
  q_list:
    - "0"
    - "1"
    - "2"
    - "3"
    - "4"
    - "5"
  initial: "0"
  final: "5"

alphabet:
  - a
  - b
  - "#"

tape_alphabet:
  - a
  - b
  - "#"
  - X
  -

delta:
  # Estado 0: lee el primer símbolo no emparejado a la izquierda de '#' y lo guarda en caché
  - params:
      initial_state: "0"
      mem_cache_value:
      tape_input: a
    output:
      final_state: "1"
      mem_cache_value: a
      tape_output:
      tape_displacement: R
  - params:
      initial_state: "0"
      mem_cache_value:
      tape_input: b
    output:
      final_state: "1"
      mem_cache_value: b
      tape_output:
      tape_displacement: R
  # Si en estado 0 encuentra '#', la mitad izquierda terminó; pasa a verificar la derecha
  - params:
      initial_state: "0"
      mem_cache_value:
      tape_input: "#"
    output:
      final_state: "4"
      mem_cache_value:
      tape_output: "#"
      tape_displacement: R

  # Estado 1: avanza hacia la derecha sobre a/b hasta cruzar el separador '#'
  - params:
      initial_state: "1"
      mem_cache_value: a
      tape_input: a
    output:
      final_state: "1"
      mem_cache_value: a
      tape_output: a
      tape_displacement: R
  - params:
      initial_state: "1"
      mem_cache_value: a
      tape_input: b
    output:
      final_state: "1"
      mem_cache_value: a
      tape_output: b
      tape_displacement: R
  - params:
      initial_state: "1"
      mem_cache_value: a
      tape_input: "#"
    output:
      final_state: "2"
      mem_cache_value: a
      tape_output: "#"
      tape_displacement: R
  - params:
      initial_state: "1"
      mem_cache_value: b
      tape_input: a
    output:
      final_state: "1"
      mem_cache_value: b
      tape_output: a
      tape_displacement: R
  - params:
      initial_state: "1"
      mem_cache_value: b
      tape_input: b
    output:
      final_state: "1"
      mem_cache_value: b
      tape_output: b
      tape_displacement: R
  - params:
      initial_state: "1"
      mem_cache_value: b
      tape_input: "#"
    output:
      final_state: "2"
      mem_cache_value: b
      tape_output: "#"
      tape_displacement: R

  # Estado 2: salta símbolos ya marcados con X y empareja el símbolo guardado en caché
  - params:
      initial_state: "2"
      mem_cache_value: a
      tape_input: X
    output:
      final_state: "2"
      mem_cache_value: a
      tape_output: X
      tape_displacement: R
  - params:
      initial_state: "2"
      mem_cache_value: b
      tape_input: X
    output:
      final_state: "2"
      mem_cache_value: b
      tape_output: X
      tape_displacement: R
  - params:
      initial_state: "2"
      mem_cache_value: a
      tape_input: a
    output:
      final_state: "3"
      mem_cache_value:
      tape_output: X
      tape_displacement: L
  - params:
      initial_state: "2"
      mem_cache_value: b
      tape_input: b
    output:
      final_state: "3"
      mem_cache_value:
      tape_output: X
      tape_displacement: L

  # Estado 3: regresa a la izquierda hasta el último blanco dejado en la mitad izquierda
  - params:
      initial_state: "3"
      mem_cache_value:
      tape_input: X
    output:
      final_state: "3"
      mem_cache_value:
      tape_output: X
      tape_displacement: L
  - params:
      initial_state: "3"
      mem_cache_value:
      tape_input: "#"
    output:
      final_state: "3"
      mem_cache_value:
      tape_output: "#"
      tape_displacement: L
  - params:
      initial_state: "3"
      mem_cache_value:
      tape_input: a
    output:
      final_state: "3"
      mem_cache_value:
      tape_output: a
      tape_displacement: L
  - params:
      initial_state: "3"
      mem_cache_value:
      tape_input: b
    output:
      final_state: "3"
      mem_cache_value:
      tape_output: b
      tape_displacement: L
  - params:
      initial_state: "3"
      mem_cache_value:
      tape_input:
    output:
      final_state: "0"
      mem_cache_value:
      tape_output:
      tape_displacement: R

  # Estado 4: verifica que toda la mitad derecha haya sido marcada con al menos una X hasta el blanco final
  - params:
      initial_state: "4"
      mem_cache_value:
      tape_input: X
    output:
      final_state: "4"
      mem_cache_value: X
      tape_output: X
      tape_displacement: R
  - params:
      initial_state: "4"
      mem_cache_value: X
      tape_input: X
    output:
      final_state: "4"
      mem_cache_value: X
      tape_output: X
      tape_displacement: R
  - params:
      initial_state: "4"
      mem_cache_value: X
      tape_input:
    output:
      final_state: "5"
      mem_cache_value:
      tape_output:
      tape_displacement: S

simulation_strings:
  # 2 cadenas aceptadas con longitud >= 5
  - aab#aab
  - abbba#abbba
  # 2 cadenas rechazadas con longitud >= 5
  - aab#aba
  - abbababa#aba

